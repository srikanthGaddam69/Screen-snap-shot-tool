<!DOCTYPE html>
<html>
<head>
    <title>Screen Snapshot Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        input {
            width: 100px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
        }
    </style>
</head>
<body>

<h2>Screen Snapshot Tool</h2>

<label>Interval (seconds):</label>
<input id="interval" type="number" value="10">

<label>Duration (minutes):</label>
<input id="duration" type="number" value="1">

<br><br>

<button onclick="startCapture()">Start Capture</button>
<button onclick="stopCapture()">Stop</button>

<video id="video" autoplay muted style="display:none;"></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>

let captureTimer;
let endTimer;
let stream;

async function startCapture() {

    try {

        stream = await navigator.mediaDevices.getDisplayMedia({
            video: true
        });

        const video = document.getElementById("video");
        video.srcObject = stream;

        await video.play();

        const interval =
            Number(document.getElementById("interval").value) * 1000;

        const duration =
            Number(document.getElementById("duration").value) * 60000;

        captureTimer = setInterval(takeScreenshot, interval);

        endTimer = setTimeout(() => {
            stopCapture();
            alert("Capture completed.");
        }, duration);

        alert("Capture started.");

    } catch (err) {
        alert("Screen sharing cancelled.");
    }
}

function takeScreenshot() {

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");

    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(video, 0, 0);

    const link = document.createElement("a");

    const timestamp = new Date()
        .toISOString()
        .replace(/[:.]/g, "-");

    link.download = `Screenshot_${timestamp}.png`;
    link.href = canvas.toDataURL("image/png");

    link.click();
}

function stopCapture() {

    clearInterval(captureTimer);
    clearTimeout(endTimer);

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
}

</script>

</body>
</html>
